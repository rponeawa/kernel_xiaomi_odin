name: Build odin kernel (ReSukiSU + OIS fix)

on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: "Android NDK tag"
        required: true
        default: "r29"
      resukisu_ref:
        description: "ReSukiSU ref to build against"
        required: true
        default: "main"
      push_branch:
        description: "Push the integrated tree to odin-ois-integrated"
        required: true
        default: "true"

env:
  DEVICE: odin
  DEFCONFIG: odin_defconfig
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  CCACHE_DIR: /home/runner/.ccache
  # ReSukiSU integration commits, taken from the resukisu branch, oldest first.
  KSU_COMMITS: "362024329e 3ec2e7708c 102d072016 63cbcc2429 bf6bab2b26"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h /

      - name: Checkout (full history, needed for cherry-pick)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record base
        run: |
          git config user.name "odin-ci"
          git config user.email "odin-ci@users.noreply.github.com"
          echo "base branch: ${{ github.ref_name }}"
          git log --oneline -1

      - name: Cherry-pick ReSukiSU integration from the resukisu branch
        run: |
          git fetch --no-tags origin resukisu:refs/remotes/origin/resukisu
          for c in $KSU_COMMITS; do
            subject=$(git log --format=%s -1 "$c")
            echo "::group::cherry-pick $c  $subject"
            if ! git cherry-pick -x "$c"; then
              echo "::endgroup::"
              echo "::error::cherry-pick failed on $c ($subject)"
              git --no-pager diff --name-only --diff-filter=U
              git --no-pager diff | head -300
              exit 1
            fi
            echo "::endgroup::"
          done
          git log --oneline -6

      - name: Backport susfs thread-flag helpers needed by current ReSukiSU
        run: |
          # susfs 2.1.0 (the version carried on the resukisu branch) predates the
          # TIF_PROC_NO_SU / TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT helpers that current
          # ReSukiSU calls from its execve and setuid hooks. They are header-only
          # thread-flag accessors, so the numbers and bodies are taken verbatim
          # from susfs4ksu upstream.
          git apply -v .github/susfs-def-thread-flags.patch
          git add include/linux/susfs_def.h
          git commit -m "susfs: Add thread-flag helpers used by current ReSukiSU" || true
          grep -nE 'TIF_PROC_NO_SU|TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT' include/linux/susfs_def.h

      - name: Switch KernelSU to ${{ github.event.inputs.resukisu_ref }}
        run: |
          rm -rf KernelSU
          git clone https://github.com/ReSukiSU/ReSukiSU KernelSU
          cd KernelSU
          git checkout "${{ github.event.inputs.resukisu_ref }}"
          echo "ReSukiSU: $(git rev-parse --short HEAD)  $(git describe --tags --always)"
          cd ..
          git add KernelSU
          git commit -m "drivers: Update ReSukiSU to ${{ github.event.inputs.resukisu_ref }}" || true

      - name: Enable ReSukiSU in defconfig
        run: |
          DC="arch/arm64/configs/$DEFCONFIG"
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-inkypen-ois"/' "$DC"
          printf '\n' >> "$DC"
          cat .github/ksu.fragment >> "$DC"
          git add "$DC"
          git commit -m "arm64: configs: Enable ReSukiSU" || true
          grep -nE 'CONFIG_LOCALVERSION|CONFIG_KSU=' "$DC"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex libelf-dev libssl-dev libncurses-dev \
            build-essential ccache zip unzip curl device-tree-compiler \
            python3 rsync p7zip-full

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-odin-${{ github.run_id }}
          restore-keys: ccache-odin-

      - name: Fetch Android NDK
        env:
          NDK_VER: ${{ github.event.inputs.ndk_version }}
        run: |
          curl -fL --retry 3 -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip"
          unzip -q ndk.zip && rm -f ndk.zip
          mv "android-ndk-${NDK_VER}" ndk
          echo "${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Configure ccache
        run: |
          mkdir -p /home/runner/.ccache
          ccache --set-config compression=true
          ccache --set-config max_size=5G
          ccache --set-config compiler_check="%compiler% --version"
          ccache -z

      - name: Show clang version
        run: clang --version

      - name: make ${{ env.DEFCONFIG }}
        run: |
          make -j"$(nproc)" O="$OUT_DIR" ARCH="$ARCH" SUBARCH="$SUBARCH" \
            CC="ccache clang" HOSTCC="ccache clang" LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          echo "--- resolved config ---"
          grep -E '^CONFIG_(KSU|KSU_SUSFS|LOCALVERSION)=' "$OUT_DIR/.config" | head -20
          grep -q '^CONFIG_KSU=y' "$OUT_DIR/.config" || { echo "CONFIG_KSU did not survive olddefconfig"; exit 1; }

      - name: Build kernel and modules
        run: |
          set -o pipefail
          make -j"$(nproc)" O="$OUT_DIR" ARCH="$ARCH" SUBARCH="$SUBARCH" \
            CC="ccache clang" HOSTCC="ccache clang" LLVM=1 LLVM_IAS=1 \
            2>&1 | tee build.log

      - name: Verify the OIS post-init path is compiled in
        run: |
          KO=$(find "$OUT_DIR" -name camera.ko | head -1)
          echo "camera.ko: $KO"
          test -n "$KO"
          if strings "$KO" | grep -q "apply post init settings"; then
            echo "OK: OIS post-init path present in camera.ko"
          else
            echo "FAIL: OIS post-init string missing from camera.ko"
            exit 1
          fi

      - name: Install modules
        run: |
          make -j"$(nproc)" O="$OUT_DIR" ARCH="$ARCH" \
            CC="ccache clang" HOSTCC="ccache clang" LLVM=1 LLVM_IAS=1 \
            INSTALL_MOD_PATH="${{ github.workspace }}/modules_out" \
            INSTALL_MOD_STRIP=1 modules_install
          echo "module count: $(find modules_out -name '*.ko' | wc -l)"

      - name: Package AnyKernel3 zip
        id: pack
        run: |
          IMAGE="$OUT_DIR/arch/$ARCH/boot/Image"
          test -f "$IMAGE" || { echo "Image not found"; exit 1; }

          git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/.github
          cp -f anykernel/anykernel.sh AnyKernel3/anykernel.sh
          cp -f "$IMAGE" AnyKernel3/Image

          mkdir -p AnyKernel3/vendor_modules
          find modules_out -name '*.ko' -exec cp -f {} AnyKernel3/vendor_modules/ \;
          echo "packaged $(ls AnyKernel3/vendor_modules/*.ko | wc -l) modules"

          KREL=$(cat "$OUT_DIR/include/config/kernel.release" 2>/dev/null || echo 5.4.302)
          KSUVER=$(cd KernelSU && git describe --tags --always 2>/dev/null || echo unknown)
          NAME="Odin-${KREL}-ReSukiSU-${KSUVER}-OIS.zip"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

          cd AnyKernel3
          zip -r9 "../$NAME" ./* -x '.git*'
          cd ..
          ls -lh "$NAME"

      - name: Push integrated tree
        if: ${{ github.event.inputs.push_branch == 'true' }}
        run: git push -f origin HEAD:refs/heads/odin-ois-integrated

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-kernel-ois-${{ github.run_number }}
          path: |
            *.zip
            build.log
          retention-days: 30
          if-no-files-found: error
